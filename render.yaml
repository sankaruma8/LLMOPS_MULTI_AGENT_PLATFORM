services:
  - type: web
    name: llmops-api
    runtime: docker
    dockerfilePath: Dockerfile
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: TAVILY_API_KEY
        sync: false
      - key: LANGCHAIN_TRACING_V2
        value: "false"
      - key: APP_WORKERS
        value: "2"
      - key: APP_ENV
        value: "production"
    healthCheckPath: /health
    autoDeploy: true

  - type: web
    name: llmops-frontend
    runtime: docker
    dockerfilePath: Dockerfile.frontend
    envVars:
      - key: BACKEND_URL
        fromService:
          name: llmops-api
          type: web
          property: host
    autoDeploy: true

  - type: web
    name: llmops-prometheus
    runtime: docker
    dockerfilePath: Dockerfile.prometheus
    plan: free
    envVars:
      - key: API_HOST
        fromService:
          name: llmops-api
          type: web
          property: host
    autoDeploy: false

  - type: web
    name: llmops-grafana
    runtime: docker
    dockerfilePath: Dockerfile.grafana
    plan: free
    envVars:
      - key: GF_SECURITY_ADMIN_USER
        value: admin
      - key: GF_SECURITY_ADMIN_PASSWORD
        sync: false
      - key: GF_USERS_ALLOW_SIGN_UP
        value: "false"
    autoDeploy: false
