global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/alerting_rules.yml

scrape_configs:
  - job_name: "llmops-api"
    metrics_path: /prometheus/metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels:
          service: llmops-api

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
